# nginx config for serving the Vite-built React SPA.
# Paired with infrastructure/docker/frontend.Dockerfile (loaded via the
# `infra` build context) and copied to /etc/nginx/conf.d/default.conf.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root        /usr/share/nginx/html;
    index       index.html;

    # Compression for text payloads. nginx:alpine ships gzip on by default,
    # but the default types list excludes JS/JSON/SVG — make it explicit.
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Vite emits hashed filenames under /assets/ — safe to cache forever.
    location /assets/ {
        access_log  off;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        try_files   $uri =404;
    }

    # The HTML shell must never be cached: it embeds the latest hashed
    # asset URLs and is the only thing CloudFront/the ALB will revalidate.
    location = /index.html {
        add_header  Cache-Control "no-cache, no-store, must-revalidate";
        add_header  Pragma "no-cache";
        expires     0;
    }

    # SPA fallback — every unknown path serves index.html so React Router
    # can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight liveness probe used by ECS healthCheck and the ALB target
    # group. Returns 200 with no body — does not exercise the app bundle.
    location = /healthz {
        access_log  off;
        return 200 "ok\n";
        add_header  Content-Type text/plain;
    }

    # Don't leak nginx version in error pages / Server header.
    server_tokens off;
}
