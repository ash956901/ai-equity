<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquityAI Codebase Visualization</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: #1a1a2e;
            padding: 20px;
            border-radius: 8px;
        }
        .graph-container {
            width: 100%;
            height: 600px;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            background: #1e1e2e;
            margin: 20px 0;
        }
        .community-0 { fill: #4E79A7; }
        .community-1 { fill: #F28E2B; }
        .community-2 { fill: #E15759; }
        .community-3 { fill: #76B7B2; }
        .community-4 { fill: #59A14F; }
        .community-5 { fill: #EDC948; }
        .community-6 { fill: #B07AA1; }
        .community-7 { fill: #D372B9; }
        .community-8 { fill: #8CD3E9; }
        .community-9 { fill: #8AD95A; }
        .community-10 { fill: #E15759; }
    </style>
</head>
<body>
    <div class="container">
        <h1>EquityAI Codebase Knowledge Graph</h1>
        <div class="graph-container">
            <h2>Codebase Structure Visualization</h2>
            <p>This visualization shows the knowledge graph of the EquityAI codebase with properly labeled elements.</p>
        </div>
    </div>
</body>
</html>
