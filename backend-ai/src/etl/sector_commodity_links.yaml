# Sector / industry / company -> commodity links.
#
# scope_type:  sector | industry | company
# role:        input | output | substitute | hedge
# weight:      0.0 - 1.0 (importance of this commodity to the scope)
# commodity_code matches the codes in sources.yaml -> commodity series
#
# Used by the Insight + Theme agents to propagate commodity moves to companies
# (e.g., sugar futures -> sugar mill output -> ethanol policy beneficiaries).

links:
